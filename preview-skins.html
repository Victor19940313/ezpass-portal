<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>新風格候選 — ezpass</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230c0c0f%22/><text x=%2250%22 y=%2270%22 font-size=%2255%22 text-anchor=%22middle%22>🎨</text></svg>"
    />
    <style>
      /* 這一頁是「給 HUA 挑」的預覽頁，不是正式樣式。
         每個候選是一個 <section>，只改 --sk-* 變數 —— 跟正式 skin.css 完全同一組變數，
         所以看到的顏色關係就是套用之後真正會長的樣子。 */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f2ec;
        font-family:
          "Noto Sans TC",
          system-ui,
          -apple-system,
          sans-serif;
        color: #2b2a26;
        padding: 0 0 4rem;
      }
      .head {
        padding: 1.4rem 1rem 1rem;
        max-width: 880px;
        margin: 0 auto;
      }
      .head h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
      }
      .head p {
        margin: 0.35rem 0;
        font-size: 0.9rem;
        line-height: 1.75;
        color: #55524b;
      }
      .head .why {
        background: #fff;
        border: 1.5px solid #e3e0d8;
        border-radius: 12px;
        padding: 0.8rem 1rem;
        margin-top: 0.9rem;
        font-size: 0.85rem;
        line-height: 1.8;
      }
      .head .why b {
        color: #6b21a8;
      }

      .cands {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      /* ── 候選卡外框 ───────────────────────────────── */
      .cand {
        margin-top: 1.6rem;
        border-radius: 18px;
        overflow: hidden;
        border: 1.5px solid #ddd9d0;
        background: #fff;
      }
      .cand > .bar {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        flex-wrap: wrap;
        padding: 0.7rem 1rem;
        background: #fff;
        border-bottom: 1.5px solid #ece9e2;
      }
      .cand > .bar .tag {
        font-weight: 900;
        font-size: 0.95rem;
        color: #2b2a26;
      }
      .cand > .bar .note {
        font-size: 0.78rem;
        color: #6b6862;
      }
      .swatches {
        display: flex;
        gap: 0.3rem;
        padding: 0 1rem 0.7rem;
        background: #fff;
        flex-wrap: wrap;
      }
      .swatches i {
        width: 26px;
        height: 18px;
        border-radius: 5px;
        display: block;
        border: 1px solid rgba(0, 0, 0, 0.18);
      }

      /* ── 模擬畫面本體：全部吃 --sk-* 變數 ───────────── */
      .demo {
        padding: 1rem;
        background: var(--sk-bg);
        background-image: var(--sk-bg-img, none);
        color: var(--sk-ink);
        font-family: var(--sk-font, inherit);
      }
      .demo .card {
        background: var(--sk-card);
        border: var(--sk-bw, 1px) solid var(--sk-line);
        border-radius: var(--sk-radius, 14px);
        padding: 0.85rem 1rem;
        margin-bottom: 0.8rem;
        box-shadow: var(--sk-shadow, none);
      }
      .demo .userbar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .demo .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--sk-accent-solid, var(--sk-accent));
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 0.82rem;
      }
      .demo .uname {
        font-weight: 800;
        font-size: 0.88rem;
        color: var(--sk-ink);
      }
      .demo .badge {
        background: var(--sk-accent-soft);
        color: var(--sk-accent);
        border: 1px solid var(--sk-accent);
        border-radius: 999px;
        padding: 0.12rem 0.6rem;
        font-size: 0.75rem;
        font-weight: 800;
      }
      .demo .qno {
        font-size: 0.75rem;
        color: var(--sk-mute);
        margin-bottom: 0.35rem;
      }
      .demo .qtext {
        font-weight: 700;
        line-height: 1.75;
        font-size: 0.95rem;
        margin-bottom: 0.7rem;
      }
      .demo .opt {
        border: var(--sk-bw, 1px) solid var(--sk-line);
        background: var(--sk-card);
        color: var(--sk-ink);
        border-radius: var(--sk-radius-s, 10px);
        padding: 0.55rem 0.75rem;
        margin-bottom: 0.4rem;
        font-size: 0.9rem;
        line-height: 1.6;
      }
      .demo .opt.correct {
        background: var(--sk-ok-bg);
        border-color: var(--sk-ok-line);
        color: var(--sk-ok-ink);
        font-weight: 700;
      }
      .demo .opt.wrong {
        background: var(--sk-no-bg);
        border-color: var(--sk-no-line);
        color: var(--sk-no-ink);
        font-weight: 700;
      }
      .demo .opt.mark {
        background: var(--sk-hl-bg);
        border-color: var(--sk-hl-line);
        color: var(--sk-hl-ink);
        font-weight: 700;
      }
      .demo .expl {
        background: var(--sk-card2, var(--sk-card));
        border: var(--sk-bw, 1px) solid var(--sk-line);
        border-left: 3px solid var(--sk-accent);
        border-radius: var(--sk-radius-s, 10px);
        padding: 0.7rem 0.85rem;
        font-size: 0.87rem;
        line-height: 1.85;
      }
      .demo .expl .sec {
        color: var(--sk-accent);
        font-weight: 800;
      }
      .demo .expl .num {
        color: var(--sk-num, var(--sk-accent));
        font-weight: 800;
      }
      .demo .expl mark {
        background: var(--sk-hl-bg);
        color: var(--sk-hl-ink);
        border-radius: 3px;
        padding: 0 2px;
      }
      .demo .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.8rem;
      }
      .demo button {
        font-family: inherit;
        cursor: default;
        font-weight: 800;
        font-size: 0.82rem;
        border-radius: var(--sk-radius-s, 10px);
        padding: 0.45rem 0.9rem;
      }
      .demo .btn-p {
        background: var(--sk-accent-solid, var(--sk-accent));
        color: var(--sk-accent-ink-on-solid, #fff);
        border: var(--sk-bw, 1px) solid var(--sk-accent-solid, var(--sk-accent));
      }
      .demo .btn-s {
        background: var(--sk-card);
        color: var(--sk-accent);
        border: var(--sk-bw, 1px) solid var(--sk-line);
      }
      .demo label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 0.25rem;
        color: var(--sk-ink);
      }
      .demo input {
        width: 100%;
        font-family: inherit;
        font-size: 0.9rem;
        padding: 0.5rem 0.7rem;
        border-radius: var(--sk-radius-s, 10px);
        background: var(--sk-input-bg, var(--sk-card));
        border: var(--sk-bw, 1px) solid var(--sk-input-line, var(--sk-line));
        color: var(--sk-ink);
      }
      .demo input::placeholder {
        color: var(--sk-mute);
      }
      .demo .plans {
        display: flex;
        gap: 0.5rem;
      }
      .demo .plan {
        flex: 1;
        text-align: center;
        padding: 0.7rem 0.4rem;
        border-radius: var(--sk-radius-s, 10px);
        border: var(--sk-bw, 1px) solid var(--sk-line);
        background: var(--sk-card);
      }
      .demo .plan.sel {
        background: var(--sk-accent-soft);
        border-color: var(--sk-accent);
        box-shadow: 0 0 0 2px var(--sk-accent) inset;
      }
      .demo .plan .nm {
        font-size: 0.82rem;
        font-weight: 800;
        color: var(--sk-ink);
      }
      .demo .plan .pr {
        font-size: 1.15rem;
        font-weight: 900;
        color: var(--sk-accent);
      }
      .demo .sub {
        font-size: 0.78rem;
        color: var(--sk-ink2);
      }
      .demo .mutetx {
        font-size: 0.75rem;
        color: var(--sk-mute);
      }
      .demo h3 {
        margin: 0 0 0.4rem;
        font-size: 0.95rem;
        color: var(--sk-ink);
      }

      .cr {
        padding: 0.6rem 1rem 0.9rem;
        background: #fff;
        font-size: 0.76rem;
        color: #55524b;
        line-height: 1.9;
      }
      .cr b {
        color: #2b2a26;
      }
      .cr .ok {
        color: #15803d;
        font-weight: 800;
      }
      .cr .bad {
        color: #b91c1c;
        font-weight: 800;
      }
      .cr .warn {
        color: #b45309;
        font-weight: 800;
      }

      /* ─────────────────────────────────────────────
         候選 1：復古俏皮（像妳貼的第 3 張）
         深炭底 + 奶油色視窗 + 飽和平面色塊 + 硬邊陰影
         ───────────────────────────────────────────── */
      .sk-retro {
        --sk-bg: #23211f;
        --sk-bg-img: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.07) 1px, transparent 0);
        --sk-card: #fdf3d8;
        --sk-card2: #f7e9c4;
        --sk-ink: #23211f;
        --sk-ink2: #6b6153;
        --sk-mute: #857b6c;
        --sk-line: #23211f;
        --sk-accent: #c8371f;
        --sk-accent-solid: #ff5c43;
        --sk-accent-soft: #ffe2d6;
        --sk-accent-ink-on-solid: #ffffff;
        --sk-num: #14619f;
        --sk-radius: 14px;
        --sk-radius-s: 10px;
        --sk-bw: 2.5px;
        --sk-shadow: 4px 4px 0 #23211f;
        --sk-ok-bg: #bdf0c8;
        --sk-ok-line: #23211f;
        --sk-ok-ink: #14512a;
        --sk-no-bg: #ffc7bd;
        --sk-no-line: #23211f;
        --sk-no-ink: #8f2213;
        --sk-hl-bg: #ffd53d;
        --sk-hl-line: #23211f;
        --sk-hl-ink: #23211f;
        --sk-input-bg: #fffaf0;
        --sk-input-line: #23211f;
      }
      /* ─────────────────────────────────────────────
         候選 2：柔和水彩（像妳貼的第 4 張）
         薄荷→粉的暈染底 + 白卡片 + 湖水綠
         ───────────────────────────────────────────── */
      .sk-aquarelle {
        --sk-bg: #e6f1ec;
        --sk-bg-img: radial-gradient(900px 420px at 8% -8%, rgba(167, 226, 210, 0.75), transparent 62%),
          radial-gradient(760px 400px at 96% 12%, rgba(255, 214, 214, 0.7), transparent 60%),
          radial-gradient(700px 500px at 40% 105%, rgba(255, 240, 199, 0.75), transparent 62%);
        --sk-card: #ffffff;
        --sk-card2: #f7fbf9;
        --sk-ink: #2f4a45;
        --sk-ink2: #556f6a;
        --sk-mute: #7d9793;
        --sk-line: #cfe3dd;
        --sk-accent: #146b5e;
        --sk-accent-solid: #2a9d8f;
        --sk-accent-soft: #e2f3ef;
        --sk-accent-ink-on-solid: #ffffff;
        --sk-num: #b04f6b;
        --sk-radius: 20px;
        --sk-radius-s: 14px;
        --sk-bw: 1.5px;
        --sk-shadow: 0 8px 24px rgba(47, 74, 69, 0.1);
        --sk-ok-bg: #dff5e4;
        --sk-ok-line: #5cb478;
        --sk-ok-ink: #175c2e;
        --sk-no-bg: #ffe6e6;
        --sk-no-line: #e08b8b;
        --sk-no-ink: #98302f;
        --sk-hl-bg: #fff0b3;
        --sk-hl-line: #ddc35f;
        --sk-hl-ink: #46391a;
        --sk-input-bg: #ffffff;
        --sk-input-line: #6a958c;
      }
      /* 復古風的按鈕/卡片也要有硬邊陰影，才看得出是同一套設計語言 */
      .sk-retro .btn-p,
      .sk-retro .btn-s,
      .sk-retro .plan,
      .sk-retro input,
      .sk-retro .badge {
        box-shadow: 3px 3px 0 #23211f;
      }
      .demo .opt.correct,
      .demo .opt.wrong {
        border-width: 1.5px;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>🎨 新風格候選</h1>
      <p>
        妳貼的另外兩張圖，我做成兩個<b>新風格</b>。下面每一塊都是同一個畫面（答題 →
        對錯 → 詳解 → 訂閱），只換風格。
      </p>
      <div class="why">
        <b>這兩個是「新增」不是「取代」</b> —— 風格選單會多這兩個，
        現有的可愛風、動畫風、夜讀暗色…全部原封不動。<br />
        每一個下面都附實際量到的數字。挑好再跟我說，我才會真的做進網站。
      </div>
    </div>

    <div class="cands" id="cands"></div>

    <script>
      // 一份模板，套進每個候選的變數裡 —— 保證比較的是「顏色」而不是「版面」
      const DEMO = `
        <div class="card userbar">
          <div class="avatar">H</div><span class="uname">HUA</span>
          <span class="badge">✨ 終身會員</span>
        </div>
        <div class="card">
          <div class="qno">牙三 · 112 年第 1 次 · 第 24 題</div>
          <div class="qtext">下列何者最可能造成根管治療後持續性疼痛？</div>
          <div class="opt">(A) 根管封填不足</div>
          <div class="opt correct">(B) 遺漏的第二近心頰側根管　✓ 正確答案</div>
          <div class="opt wrong">(C) 牙冠邊緣滲漏　✗ 你選的</div>
          <div class="opt mark">(D) 咬合過高（畫了螢光筆）</div>
        </div>
        <div class="card expl">
          <span class="sec">【出題者想考什麼】</span> 上顎第一大臼齒的
          <span class="num">MB2</span> 根管出現率高達
          <span class="num">95%</span>，是治療後疼痛<mark>最常見</mark>的原因。<br />
          <span class="sec">【為何不選 C】</span> 邊緣滲漏通常造成的是遲發性再感染，不是持續性疼痛。
        </div>
        <div class="row">
          <button class="btn-p">下一題</button>
          <button class="btn-s">加入錯題本</button>
          <button class="btn-s">🔍 找相似題</button>
        </div>
        <div class="card">
          <h3>訂閱方案</h3>
          <div class="plans">
            <div class="plan"><div class="nm">月繳</div><div class="pr">$150</div></div>
            <div class="plan sel"><div class="nm">半年</div><div class="pr">$400</div></div>
            <div class="plan"><div class="nm">終身</div><div class="pr">$990</div></div>
          </div>
          <div style="margin-top:.7rem">
            <label>推薦人 email（選填）</label>
            <input placeholder="誰介紹妳來的？" />
            <div class="sub" style="margin-top:.3rem">填了推薦人會收到 30 天免費序號</div>
          </div>
        </div>`;

      const CANDS = [
        {
          cls: "sk-retro",
          tag: "1｜復古俏皮",
          note: "像妳貼的第 3 張：深炭底 + 奶油卡片 + 硬邊陰影",
          swat: ["#23211f", "#fdf3d8", "#ff5c43", "#ffd53d"],
        },
        {
          cls: "sk-aquarelle",
          tag: "2｜柔和水彩",
          note: "像妳貼的第 4 張：薄荷粉暈染 + 湖水綠",
          swat: ["#e6f1ec", "#ffffff", "#2a9d8f", "#b04f6b"],
        },
      ];

      // ── 量測 ──────────────────────────────────────────────
      // 一般文字用 WCAG 對比度沒問題。
      // 但「兩個深色面分不分得出來」**不能**用對比度:公式裡的 +0.05 在近黑時會把差距
      // 壓扁,結果每一種深色主題都會被判成「不及格」,包括 iPhone 自己的深色模式。
      // 正確工具是感知亮度 L* (CIELAB),兩個面差 5 以上人眼就分得出來。
      function lin(hex) {
        const n = hex.replace("#", "");
        return [0, 2, 4].map((i) => {
          const c = parseInt(n.substr(i, 2), 16) / 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
      }
      function lum(hex) {
        const v = lin(hex);
        return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
      }
      function Lstar(hex) {
        const y = lum(hex);
        return y > 216 / 24389 ? 116 * Math.cbrt(y) - 16 : (y * 24389) / 27;
      }
      function ratio(a, b) {
        const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p);
        return (x + 0.05) / (y + 0.05);
      }
      // 飽和度:HUA 說「現在的夜讀很多地方待加強,比如說飽和度」—— 這一項就是在量那個
      function sat(hex) {
        const [r, g, b] = hex.replace("#", "").match(/../g).map((x) => parseInt(x, 16) / 255);
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
        return mx === mn ? 0 : l > 0.5 ? (mx - mn) / (2 - mx - mn) : (mx - mn) / (mx + mn);
      }
      function rgbToHex(s) {
        const m = s.match(/\d+/g);
        if (!m) return "#000000";
        return "#" + m.slice(0, 3).map((n) => (+n).toString(16).padStart(2, "0")).join("");
      }
      function mark(v, target, unit) {
        const txt = v.toFixed(unit === "%" ? 0 : v < 20 ? 1 : 0) + (unit || "");
        if (v >= target) return '<span class="ok">' + txt + " ✓</span>";
        if (v >= target * 0.75) return '<span class="warn">' + txt + " △</span>";
        return '<span class="bad">' + txt + " ✗</span>";
      }

      const wrap = document.getElementById("cands");
      wrap.innerHTML = CANDS.map(
        (c) => `
        <div class="cand">
          <div class="bar">
            <span class="tag">${c.tag}</span>
            <span class="note">${c.note}</span>
          </div>
          <div class="swatches">${c.swat.map((s) => `<i style="background:${s}"></i>`).join("")}</div>
          <div class="demo ${c.cls}" id="d-${c.cls}">${DEMO}</div>
          <div class="cr" id="cr-${c.cls}"></div>
        </div>`,
      ).join("");

      // 量真實算完的顏色(不是我寫的變數值),避免我自己算錯
      CANDS.forEach((c) => {
        const root = document.getElementById("d-" + c.cls);
        const g = (sel, prop) => rgbToHex(getComputedStyle(root.querySelector(sel))[prop]);
        const bg = rgbToHex(getComputedStyle(root).backgroundColor);
        const card = g(".card", "backgroundColor");
        const line = g(".card", "borderTopColor");
        const ink = rgbToHex(getComputedStyle(root).color);
        const ink2 = g(".sub", "color");
        const acc = g(".plan.sel .pr", "color");
        const okInk = g(".opt.correct", "color"), okBg = g(".opt.correct", "backgroundColor");
        const noInk = g(".opt.wrong", "color"), noBg = g(".opt.wrong", "backgroundColor");
        const inpLine = g("input", "borderTopColor"), inpBg = g("input", "backgroundColor");
        document.getElementById("cr-" + c.cls).innerHTML =
          `<b>看得清楚嗎</b>（對比度，內文要 ≥ 4.5、框線這類要 ≥ 3）<br />` +
          `內文字 ${mark(ratio(ink, card), 4.5)} ・ 次要灰字 ${mark(ratio(ink2, card), 4.5)} ・ ` +
          `主色 ${mark(ratio(acc, card), 4.5)}<br />` +
          `答對 ${mark(ratio(okInk, okBg), 4.5)} ・ 答錯 ${mark(ratio(noInk, noBg), 4.5)} ・ ` +
          `輸入框框線 ${mark(ratio(inpLine, inpBg), 3)}<br />` +
          `<b>層次分得出來嗎</b>（深色面之間用感知亮度 L*，差 5 以上就看得出來）<br />` +
          // 用「差多少」不是「誰比較亮」:淺色風格的卡片比底色亮、框線比卡片暗,
          // 只看正負號會把淺色風格全部誤判成不及格 (2026-09-12 踩到)
          `卡片浮不浮得起來 ${mark(Math.abs(Lstar(card) - Lstar(bg)), 5)} ・ ` +
          `卡片框線看不看得到 ${mark(Math.abs(Lstar(line) - Lstar(card)), 8)}<br />` +
          `<b>顏色夠不夠鮮</b>（HUA 說的飽和度）主色 ${mark(sat(acc) * 100, 60, "%")}` +
          `<span style="color:#8a877f">（深底會把顏色再吃掉一層，所以要比淺色主題更鮮）</span>`;
      });
    </script>
  </body>
</html>
